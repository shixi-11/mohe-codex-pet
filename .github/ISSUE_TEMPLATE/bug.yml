name: Bug report
description: Report a reproducible problem in the desktop app or Codex Pet package.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Windows desktop app
        - Codex Pet
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep private paths, memories, and credentials out of the report.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, Codex version, Node version if relevant
